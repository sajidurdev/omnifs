[package]
name = "omnifs_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
blake3 = "1.5"
crossbeam-channel = "0.5"
globset = "0.4"
ignore = "0.4"
napi = { version = "2", features = ["napi8", "tokio_rt"] }
napi-derive = "2"
num_cpus = "1"
once_cell = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2"
