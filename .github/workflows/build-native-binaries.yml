name: Build Native Binaries

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish platform packages and root package to npm (with provenance)"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/build-native-binaries.yml"
      - "rust-core/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-native-binaries.yml"
      - "rust-core/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  id-token: write

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run RustSec audit check
        uses: actions-rust-lang/audit@v1
        with:
          workingDirectory: rust-core

  build-target:
    name: ${{ matrix.platform_arch_abi }}
    needs:
      - cargo-audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_arch_abi: linux-x64-gnu
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform_arch_abi: linux-x64-musl
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform_arch_abi: linux-arm64-gnu
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform_arch_abi: linux-arm64-musl
            use_cross: true
          - os: macos-14
            target: x86_64-apple-darwin
            platform_arch_abi: darwin-x64
            use_cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            platform_arch_abi: darwin-arm64
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_arch_abi: win32-x64-msvc
            use_cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform_arch_abi: win32-arm64-msvc
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-core -> target
          cache-on-failure: true

      - name: Install JS dependencies
        run: npm ci

      - name: Install cross (Linux cross targets)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build native binary
        shell: pwsh
        run: |
          $args = @(
            "napi",
            "build",
            "--manifest-path", "rust-core/Cargo.toml",
            "--target", "${{ matrix.target }}",
            "--platform",
            "--strip",
            "--release"
          )

          if ("${{ matrix.use_cross }}" -eq "true") {
            $args += "--use-cross"
          }

          & npx @args

      - name: Collect built artifact
        shell: pwsh
        run: |
          $expected = "index.${{ matrix.platform_arch_abi }}.node"
          $match = Get-ChildItem -Path . -Recurse -Filter $expected | Select-Object -First 1

          if (-not $match) {
            Write-Host "Expected artifact not found: $expected"
            Write-Host "Discovered *.node files:"
            Get-ChildItem -Path . -Recurse -Filter "*.node" | ForEach-Object { Write-Host $_.FullName }
            throw "Missing expected artifact: $expected"
          }

          New-Item -ItemType Directory -Path ".artifacts" -Force | Out-Null
          $artifactPath = Join-Path ".artifacts" $expected
          Copy-Item $match.FullName $artifactPath -Force

          $hash = (Get-FileHash -Path $artifactPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $expected" | Out-File -FilePath "$artifactPath.sha256" -Encoding ascii -NoNewline

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform_arch_abi }}
          path: |
            .artifacts/index.${{ matrix.platform_arch_abi }}.node
            .artifacts/index.${{ matrix.platform_arch_abi }}.node.sha256
          if-no-files-found: error

  assemble-npm-target-layout:
    name: Assemble npm target layout
    runs-on: ubuntu-latest
    needs:
      - build-target

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm ci

      - name: Create npm target directories
        run: npm run napi:create-npm-dirs

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: .artifacts
          merge-multiple: true

      - name: Verify artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            "darwin-x64"
            "darwin-arm64"
            "linux-x64-gnu"
            "linux-x64-musl"
            "linux-arm64-gnu"
            "linux-arm64-musl"
            "win32-x64-msvc"
            "win32-arm64-msvc"
          )

          for t in "${targets[@]}"; do
            checksum_file=".artifacts/index.${t}.node.sha256"
            if [[ ! -f "$checksum_file" ]]; then
              echo "Missing checksum file: $checksum_file"
              exit 1
            fi
            (cd .artifacts && sha256sum -c "index.${t}.node.sha256")
          done

      - name: Populate npm/<target> with binaries
        run: npm run napi:artifacts -- --output-dir .artifacts

      - name: Verify target binaries exist
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            "darwin-x64"
            "darwin-arm64"
            "linux-x64-gnu"
            "linux-x64-musl"
            "linux-arm64-gnu"
            "linux-arm64-musl"
            "win32-x64-msvc"
            "win32-arm64-msvc"
          )

          for t in "${targets[@]}"; do
            f="npm/${t}/index.${t}.node"
            if [[ ! -f "$f" ]]; then
              echo "Missing expected binary: $f"
              exit 1
            fi
          done

      - name: Sync optionalDependencies metadata
        run: npm run napi:prepublish

      - name: Upload assembled npm directories
        uses: actions/upload-artifact@v4
        with:
          name: npm-target-layout
          path: npm
          if-no-files-found: error

  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs:
      - assemble-npm-target-layout
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install JS dependencies
        run: npm ci

      - name: Download assembled npm target layout
        uses: actions/download-artifact@v4
        with:
          name: npm-target-layout
          path: .

      - name: Build JS wrappers
        run: |
          npm run build:js
          npm run build:esm

      - name: Publish platform packages with provenance
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          targets=(
            "darwin-x64"
            "darwin-arm64"
            "linux-x64-gnu"
            "linux-x64-musl"
            "linux-arm64-gnu"
            "linux-arm64-musl"
            "win32-x64-msvc"
            "win32-arm64-msvc"
          )

          for t in "${targets[@]}"; do
            pkg="npm/$t/package.json"
            name=$(node -p "require('./${pkg}').name")
            version=$(node -p "require('./${pkg}').version")

            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version} (already published)"
              continue
            fi

            echo "Publishing ${name}@${version} ..."
            (cd "npm/$t" && npm publish --access public --provenance)
          done

      - name: Publish root package with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "Skipping ${name}@${version} (already published)"
            exit 0
          fi

          npm publish --access public --provenance
